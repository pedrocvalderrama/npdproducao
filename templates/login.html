<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODUÇÃO - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 360px; }
    .login-card h1 { font-size: 20px; margin: 0 0 20px; text-align: center; color: #1a2b3c; }
    .login-card .form-group { margin-bottom: 14px; }
    .login-card .btn { width: 100%; margin-top: 6px; }
    .login-hint { font-size: 12px; color: #777; margin-top: 14px; text-align: center; }
    .alert { padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 13px; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-danger { background: #f8d7da; color: #721c24; }
    .alert-warning { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <div class="card login-card">
    <h1>PRODUÇÃO — Acesso</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-input" type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <p class="login-hint">Use seu nome de operador como usuário. Na primeira vez, a senha é igual ao usuário.</p>
  </div>
</body>
</html>
